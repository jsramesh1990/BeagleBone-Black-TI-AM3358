# ============================================================
# Box Storage Logging Configuration
# BeagleBone Black - TI AM3358
# ============================================================

# Logging level
#
# Options:
#   DEBUG
#   INFO
#   WARN
#   ERROR

level=INFO


# Enable console logging
# 1 = enabled
# 0 = disabled

console=1


# Enable file logging
# 1 = enabled
# 0 = disabled

file=1


# Log file location

log_file=/var/log/boxes/boxes.log


# Maximum log file size in KB

max_file_size=1024


# Number of backup log files

backup_count=3


# Include timestamp

timestamp=1


# Include log level

include_level=1
